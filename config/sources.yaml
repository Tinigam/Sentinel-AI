# miyoushe_forums use the anonymous bbs-api. gids identifies the game (2=原神,
# 6=崩坏：星穹铁道); forum_id picks the general-chat board (酒馆 / 候车室), the
# best player-voice signal. Non-miHoYo games have no miyoushe board.
miyoushe_forums:
