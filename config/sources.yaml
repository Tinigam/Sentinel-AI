# tieba_forums map each game topic to its Baidu Tieba forum (kw is the forum
# name without the 吧 suffix). Threads become community articles whose content
# is the opening post plus a 热门回复 section; the first reply floors of each
# thread are stored in community_comments for distortion metrics.
