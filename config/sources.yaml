# source_type describes the intended publishing channel; trust_tier records evidence quality.
# Google News remains a transport layer. Store the original publisher URL on each article.
rss_sources:
  - name: Google News - selected games
    source_type: aggregator
    trust_tier: aggregated
    query: 'Genshin OR "Honkai Star Rail" OR "Wuthering Waves" OR Arknights OR "Girls Frontline 2"'
  - name: GameLook via Google News
    source_type: media
    trust_tier: aggregated
    query: 'site:gamelook.com.cn (Genshin OR "Honkai Star Rail" OR "Wuthering Waves" OR Arknights OR "Girls Frontline 2")'
  - name: YYTV via Google News
    source_type: media
    trust_tier: aggregated
    query: 'site:yystv.cn (Genshin OR "Honkai Star Rail" OR "Wuthering Waves" OR Arknights OR "Girls Frontline 2")'
  - name: Youxiputao via Google News
    source_type: media
    trust_tier: aggregated
    query: 'site:youxiputao.com (Genshin OR "Honkai Star Rail" OR "Wuthering Waves" OR Arknights OR "Girls Frontline 2")'
  - name: 3DM via Google News
    source_type: media
    trust_tier: aggregated
    query: 'site:3dmgame.com (Genshin OR "Honkai Star Rail" OR "Wuthering Waves" OR Arknights OR "Girls Frontline 2")'
official_pages:
  - name: Honkai Star Rail official news
    source_type: official
    trust_tier: verified
    topic: honkai-star-rail
    url: https://sr.mihoyo.com/news?nav=news&type=news
  - name: Arknights official news
    source_type: official
    trust_tier: verified
    topic: arknights
    url: https://ak.hypergryph.com/news
  - name: Arknights Endfield official news
    source_type: official
    trust_tier: verified
    topic: arknights-endfield
    url: https://endfield.gryphline.com/zh-tw/news
